name: BHE release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v0.1.0-alpha.3"
        required: true
        default: "v0.1.0-alpha.3"
      platform:
        description: "Packages to build and publish"
        required: true
        type: choice
        default: all
        options:
          - all
          - macos
          - windows
          - android
      publish:
        description: "Publish artifacts to the GitHub Release"
        required: true
        type: boolean
        default: true
      publish_oss:
        description: "Upload selected packages and latest aliases to OSS"
        required: true
        type: boolean
        default: true
      dry_run:
        description: "Rehearse update channel without publishing"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'dryrun' || 'production' }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.8"
  PYTHON_BUILD_STANDALONE_TAG: "20260814"
  PYTHON_VERSION: "3.11.16"
  ANDROID_NDK_VERSION: "27.0.12077973"
  ONNXRUNTIME_VERSION: "1.28.0"
  ONNXRUNTIME_ANDROID_QNN_SHA256: "f3e760fa1459b42a89fdd606679477620f68e97035ae96db9f9d128b34607a84"
  QNN_RUNTIME_VERSION: "2.42.0"
  QNN_RUNTIME_SHA256: "ecb69bd6a7b1be4717ef10805199fb49ec6b60ca3f481d3068ed9605fba91d5b"

jobs:
  release-plan:
    name: Resolve release plan
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      source_ref: ${{ steps.plan.outputs.source_ref }}
      platform: ${{ steps.plan.outputs.platform }}
      build_macos: ${{ steps.plan.outputs.build_macos }}
      build_windows: ${{ steps.plan.outputs.build_windows }}
      build_android: ${{ steps.plan.outputs.build_android }}
      publish: ${{ steps.plan.outputs.publish }}
      publish_oss: ${{ steps.plan.outputs.publish_oss }}
    steps:
      - id: plan
        name: Select source and target platforms
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_PUBLISH_OSS: ${{ inputs.publish_oss }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$INPUT_DRY_RUN" == "true" && ( "$INPUT_PUBLISH" != "true" || "$INPUT_PUBLISH_OSS" != "true" ) ]]; then
              echo 'dry_run 需要同时启用 publish 和 publish_oss；请勾选两项后重新运行。' >&2
              exit 1
            fi
            tag="$INPUT_TAG"
            source_ref="refs/tags/$tag"
            platform="$INPUT_PLATFORM"
            publish="$INPUT_PUBLISH"
            publish_oss="$INPUT_PUBLISH_OSS"
          else
            tag="$REF_NAME"
            source_ref="$SHA"
            publish=true
            publish_oss=false
            case "$tag" in
              *-macos.*) platform=macos ;;
              *-windows.*) platform=windows ;;
              *-android.*) platform=android ;;
              *) platform=all ;;
            esac
          fi

          [[ "$tag" =~ ^v ]] || { echo "Release tag must start with v: $tag" >&2; exit 1; }
          case "$platform" in
            all) build_macos=true; build_windows=true; build_android=true ;;
            macos) build_macos=true; build_windows=false; build_android=false ;;
            windows) build_macos=false; build_windows=true; build_android=false ;;
            android) build_macos=false; build_windows=false; build_android=true ;;
            *) echo "Unsupported platform: $platform" >&2; exit 1 ;;
          esac

          if [[ "$publish" != "true" ]]; then
            publish=false
            publish_oss=false
          elif [[ "$publish_oss" != "true" ]]; then
            publish_oss=false
          fi

          {
            echo "tag=$tag"
            echo "source_ref=$source_ref"
            echo "platform=$platform"
            echo "build_macos=$build_macos"
            echo "build_windows=$build_windows"
            echo "build_android=$build_android"
            echo "publish=$publish"
            echo "publish_oss=$publish_oss"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### 更新通道计划：$tag"
            echo "平台 ${platform}；publish=${publish}；publish_oss=${publish_oss}。"
            echo '标签推送只发布 GitHub Release；核验后通过手动工作流先演练，再正式发布 OSS。'
            echo '此处只是计划，只有 OSS 发布 job success 才表示官网与 App 通道发布完成。'
            echo '同组最多一个运行项和一个排队项；新排队项会取消旧排队项，cancel-in-progress=false 也不会保留所有排队项。'
          } >> "$GITHUB_STEP_SUMMARY"

  macos:
    name: macOS ${{ matrix.arch }}
    needs: release-plan
    if: needs.release-plan.outputs.build_macos == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            python_target: x86_64-apple-darwin
            ffmpeg_url: https://www.osxexperts.net/ffmpeg80intel.zip
            ffprobe_url: https://www.osxexperts.net/ffprobe80intel.zip
            ffmpeg_sha256: df3f1e3facdc1ae0ad0bd898cdfb072fbc9641bf47b11f172844525a05db8d11
            ffprobe_sha256: 5228e651e2bd67bb55819b27f6138351587b16d2b87446007bf35b7cf930d891
          - runner: macos-15
            arch: arm64
            python_target: aarch64-apple-darwin
            ffmpeg_url: https://www.osxexperts.net/ffmpeg81arm.zip
            ffprobe_url: https://www.osxexperts.net/ffprobe81arm.zip
    runs-on: ${{ matrix.runner }}
    env:
      TAG_NAME: ${{ needs.release-plan.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-plan.outputs.source_ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Flutter dependencies
        working-directory: apps/desktop
        run: flutter pub get

      - name: Download portable Python
        id: python
        shell: bash
        env:
          PYTHON_TARGET: ${{ matrix.python_target }}
        run: |
          set -euo pipefail
          archive="cpython-${PYTHON_VERSION}+${PYTHON_BUILD_STANDALONE_TAG}-${PYTHON_TARGET}-install_only.tar.gz"
          encoded_archive="${archive//+/%2B}"
          url="https://github.com/astral-sh/python-build-standalone/releases/download/${PYTHON_BUILD_STANDALONE_TAG}/${encoded_archive}"
          mkdir -p "$RUNNER_TEMP/bhe-python"
          curl --fail --location --retry 3 --retry-delay 2 "$url" -o "$RUNNER_TEMP/python.tar.gz"
          tar -xzf "$RUNNER_TEMP/python.tar.gz" -C "$RUNNER_TEMP/bhe-python"
          python_root="$RUNNER_TEMP/bhe-python/python"
          test -x "$python_root/bin/python3"
          echo "root=$python_root" >> "$GITHUB_OUTPUT"
          "$python_root/bin/python3" --version

      - name: Install Python runtime dependencies
        shell: bash
        env:
          PYTHON_ROOT: ${{ steps.python.outputs.root }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          export PIP_DISABLE_PIP_VERSION_CHECK=1
          "$PYTHON_ROOT/bin/python3" -m pip install --no-cache-dir --upgrade pip
          if [[ "$ARCH" == "x86_64" ]]; then
            "$PYTHON_ROOT/bin/python3" -m pip install --no-cache-dir -c requirements-macos-intel-constraints.txt -r requirements.txt
            "$PYTHON_ROOT/bin/python3" -m pip check
          else
            "$PYTHON_ROOT/bin/python3" -m pip install --no-cache-dir -r requirements.txt
          fi
          "$PYTHON_ROOT/bin/python3" -c 'import cv2, numpy, pandas, psutil, torch, ultralytics; print("runtime imports: OK")'

      - name: Install CoreML acceleration and export static ONNX
        shell: bash
        env:
          PYTHON_ROOT: ${{ steps.python.outputs.root }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # CoreML 后端只跑在 Apple Silicon 上(代码里也用 platform.machine() 限定),
          # Intel 包不塞 onnxruntime 和静态模型,免得白加 90MB。
          if [[ "$ARCH" != "arm64" ]]; then
            echo "Skipping CoreML packages for $ARCH"
            exit 0
          fi
          # 装不上不应该阻断整条发布链路:没有 CoreML 时 mps/CPU 仍然可用。
          if ! "$PYTHON_ROOT/bin/python3" -m pip install --no-cache-dir -r requirements-coreml.txt; then
            echo "::warning::onnxruntime with CoreML failed to install; macOS will use mps/CPU"
            exit 0
          fi
          # 装上了却导入不了时同样只告警，并卸掉坏包，免得运行时探测 CoreML 时出错。
          if ! "$PYTHON_ROOT/bin/python3" -c "import onnxruntime; print('providers', onnxruntime.get_available_providers())"; then
            echo "::warning::onnxruntime installed but cannot be imported; macOS will use mps/CPU"
            "$PYTHON_ROOT/bin/python3" -m pip uninstall -y onnxruntime onnx || true
            exit 0
          fi
          # 静态 batch=1、640x640:CoreML 的静态输入只吃方形单张,动态 batch 模型这里不用。
          if ! "$PYTHON_ROOT/bin/python3" scripts/export_mobile_model.py \
            --model models/bball_model.pt \
            --output models/bball_model.static.onnx \
            --imgsz 640 --batch 1; then
            echo "::warning::static ONNX export failed; macOS will use mps/CPU"
            exit 0
          fi
          test -s models/bball_model.static.onnx
          ls -l models/bball_model.static.onnx
          # onnx 只在导出时用得上,别让它跟着安装包出去(约 32MB)。
          "$PYTHON_ROOT/bin/python3" -m pip uninstall -y onnx \
            || echo "::warning::failed to drop the build-only onnx package"

      - name: Download self-contained FFmpeg
        id: ffmpeg
        shell: bash
        env:
          FFMPEG_URL: ${{ matrix.ffmpeg_url }}
          FFPROBE_URL: ${{ matrix.ffprobe_url }}
          FFMPEG_SHA256: ${{ matrix.ffmpeg_sha256 }}
          FFPROBE_SHA256: ${{ matrix.ffprobe_sha256 }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bhe-ffmpeg" "$RUNNER_TEMP/bhe-ffprobe"
          curl --fail --location --retry 3 --retry-delay 2 "$FFMPEG_URL" -o "$RUNNER_TEMP/ffmpeg.zip"
          curl --fail --location --retry 3 --retry-delay 2 "$FFPROBE_URL" -o "$RUNNER_TEMP/ffprobe.zip"
          unzip -oq "$RUNNER_TEMP/ffmpeg.zip" -d "$RUNNER_TEMP/bhe-ffmpeg"
          unzip -oq "$RUNNER_TEMP/ffprobe.zip" -d "$RUNNER_TEMP/bhe-ffprobe"
          ffmpeg_path="$(find "$RUNNER_TEMP/bhe-ffmpeg" -type f -name ffmpeg -print -quit)"
          ffprobe_path="$(find "$RUNNER_TEMP/bhe-ffprobe" -type f -name ffprobe -print -quit)"
          test -n "$ffmpeg_path" && test -n "$ffprobe_path"
          if [[ -n "$FFMPEG_SHA256" ]]; then
            printf '%s  %s\n' "$FFMPEG_SHA256" "$ffmpeg_path" | shasum -a 256 --check
            printf '%s  %s\n' "$FFPROBE_SHA256" "$ffprobe_path" | shasum -a 256 --check
          fi
          chmod +x "$ffmpeg_path" "$ffprobe_path"
          file "$ffmpeg_path" "$ffprobe_path"
          lipo "$ffmpeg_path" -verify_arch "$ARCH"
          lipo "$ffprobe_path" -verify_arch "$ARCH"
          "$ffmpeg_path" -version
          "$ffprobe_path" -version
          echo "ffmpeg=$ffmpeg_path" >> "$GITHUB_OUTPUT"
          echo "ffprobe=$ffprobe_path" >> "$GITHUB_OUTPUT"

      - name: Disable indexing on the ephemeral macOS runner
        run: |
          if ! sudo mdutil -a -i off; then
            echo "::warning::Some volumes could not disable indexing; DMG creation retries Resource busy errors."
          fi

      - name: Build macOS package
        shell: bash
        env:
          PYTHON_ROOT: ${{ steps.python.outputs.root }}
          FFMPEG_PATH: ${{ steps.ffmpeg.outputs.ffmpeg }}
          FFPROBE_PATH: ${{ steps.ffmpeg.outputs.ffprobe }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          dmg="$GITHUB_WORKSPACE/dist/BHE-macos-${ARCH}-v${version}-adhoc.dmg"
          BHE_PYTHON_RUNTIME="$PYTHON_ROOT" \
          BHE_FFMPEG="$FFMPEG_PATH" \
          BHE_FFPROBE="$FFPROBE_PATH" \
          BHE_BUILD_NAME="$version" \
          BHE_BUILD_NUMBER="${GITHUB_RUN_NUMBER}" \
          BHE_DMG_OUT="$dmg" \
          FLUTTER_BIN="$(command -v flutter)" \
          scripts/build_macos_release.sh
          file "apps/desktop/build/macos/Build/Products/Release/BHE.app/Contents/MacOS/BHE"
          codesign --verify --deep --strict "apps/desktop/build/macos/Build/Products/Release/BHE.app"
          # Test the bundled interpreter after runtime copying and signing.
          export PYTHONDONTWRITEBYTECODE=1 YOLO_AUTOINSTALL=false
          export YOLO_CONFIG_DIR="$RUNNER_TEMP/bhe-yolo-smoke"
          python3 scripts/check_numpy_preprocess.py --python \
            "apps/desktop/build/macos/Build/Products/Release/BHE.app/Contents/Resources/runtime/python/bin/python3"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: BHE-macos-${{ matrix.arch }}
          path: |
            dist/BHE-macos-${{ matrix.arch }}-v*-adhoc.dmg
            dist/BHE-macos-${{ matrix.arch }}-v*-adhoc.dmg.sha256
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: release-plan
    if: needs.release-plan.outputs.build_windows == 'true'
    runs-on: windows-2022
    env:
      TAG_NAME: ${{ needs.release-plan.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-plan.outputs.source_ref }}

      - name: Validate Windows updater
        shell: powershell
        run: |
          ./scripts/test_windows_update_inventory.ps1
          ./scripts/test_windows_update.ps1
          ./scripts/test_windows_patch_inventory.ps1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Flutter dependencies
        working-directory: apps/desktop
        run: flutter pub get

      - name: Download portable Python
        id: python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "cpython-$env:PYTHON_VERSION+$env:PYTHON_BUILD_STANDALONE_TAG-x86_64-pc-windows-msvc-install_only.tar.gz"
          $encodedArchive = $archive.Replace('+', '%2B')
          $url = "https://github.com/astral-sh/python-build-standalone/releases/download/$env:PYTHON_BUILD_STANDALONE_TAG/$encodedArchive"
          $pythonBase = Join-Path $env:RUNNER_TEMP "bhe-python"
          New-Item -ItemType Directory -Force -Path $pythonBase | Out-Null
          Invoke-WebRequest -Uri $url -OutFile (Join-Path $env:RUNNER_TEMP "python.tar.gz")
          tar -xzf (Join-Path $env:RUNNER_TEMP "python.tar.gz") -C $pythonBase
          $pythonRoot = Join-Path $pythonBase "python"
          if (-not (Test-Path (Join-Path $pythonRoot "python.exe"))) { throw "portable Python was not extracted" }
          "root=$pythonRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          & (Join-Path $pythonRoot "python.exe") --version

      - name: Install Python runtime dependencies
        shell: pwsh
        env:
          PYTHON_ROOT: ${{ steps.python.outputs.root }}
        run: |
          $ErrorActionPreference = "Stop"
          $python = Join-Path $env:PYTHON_ROOT "python.exe"
          & $python -m pip install --no-cache-dir --upgrade pip
          & $python -m pip install --no-cache-dir -r requirements.txt
          # DirectML 加速包(24MB):让桌面端在有独显/核显的机器上走 ONNX Runtime。
          # 装不上不应该阻断整条发布链路,CPU 路径仍然可用。
          & $python -m pip install --no-cache-dir -r requirements-dml.txt
          if ($LASTEXITCODE -ne 0) { Write-Warning "onnxruntime-directml install failed; DML will fall back to CPU" }
          & $python -c "import cv2, numpy, pandas, psutil, torch, ultralytics; print('runtime imports: OK')"
          & $python -c "import onnxruntime; print('onnxruntime', onnxruntime.__version__, onnxruntime.get_available_providers())"

      - name: Download self-contained FFmpeg
        id: ffmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-8.1.zip"
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $extract = Join-Path $env:RUNNER_TEMP "bhe-ffmpeg"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem -Path $extract -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $extract -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "ffmpeg.exe or ffprobe.exe was not found" }
          "ffmpeg=$($ffmpeg.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "ffprobe=$($ffprobe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          & $ffmpeg.FullName -version | Select-Object -First 1

      - name: Build Windows package
        shell: pwsh
        env:
          PYTHON_ROOT: ${{ steps.python.outputs.root }}
          FFMPEG_PATH: ${{ steps.ffmpeg.outputs.ffmpeg }}
          FFPROBE_PATH: ${{ steps.ffmpeg.outputs.ffprobe }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:TAG_NAME -replace '^v', ''
          $package = Join-Path $env:GITHUB_WORKSPACE "dist\BHE-windows-x64-v$version.zip"
          & powershell -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\scripts\build_windows_release.ps1" `
            -Version $version `
            -PythonRuntime $env:PYTHON_ROOT `
            -Ffmpeg $env:FFMPEG_PATH `
            -Ffprobe $env:FFPROBE_PATH `
            -RuntimeOut "$env:GITHUB_WORKSPACE\dist\windows-runtime" `
            -PackageOut $package
          if ($LASTEXITCODE -ne 0) { throw "Windows package build failed" }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BHE-windows-x64
          path: |
            dist/BHE-windows-x64-v*.zip
            dist/BHE-windows-x64-v*.zip.sha256
          if-no-files-found: error

  android:
    name: Android arm64-v8a
    needs: release-plan
    if: needs.release-plan.outputs.build_android == 'true'
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ needs.release-plan.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-plan.outputs.source_ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Set up Python for ONNX export
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Export mobile ONNX model
        run: |
          set -euo pipefail
          # Exporting also loads the .pt checkpoint and its declared dependencies (dill).
          python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt onnx
          python scripts/export_mobile_model.py \
            --model models/bball_model.pt \
            --output apps/mobile/assets/models/bball_model.onnx
          test -s apps/mobile/assets/models/bball_model.onnx

      - name: Download ONNX Runtime Android library
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/onnxruntime-android.aar"
          runtime_dir="$RUNNER_TEMP/onnxruntime-android"
          url="https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android-qnn/${ONNXRUNTIME_VERSION}/onnxruntime-android-qnn-${ONNXRUNTIME_VERSION}.aar"
          curl --fail --location --retry 3 --retry-delay 2 "$url" -o "$archive"
          echo "${ONNXRUNTIME_ANDROID_QNN_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$runtime_dir"
          unzip -q "$archive" -d "$runtime_dir"
          test -f "$runtime_dir/jni/arm64-v8a/libonnxruntime.so"
          mkdir -p "$runtime_dir/arm64-v8a"
          cp "$runtime_dir/jni/arm64-v8a/libonnxruntime.so" "$runtime_dir/arm64-v8a/"
          echo "BHE_ORT_ANDROID_DIR=$runtime_dir" >> "$GITHUB_ENV"

      - name: Download Qualcomm QNN runtime libraries
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/qnn-runtime.aar"
          qnn_dir="$RUNNER_TEMP/qnn-runtime"
          url="https://repo1.maven.org/maven2/com/qualcomm/qti/qnn-runtime/${QNN_RUNTIME_VERSION}/qnn-runtime-${QNN_RUNTIME_VERSION}.aar"
          curl --fail --location --retry 3 --retry-delay 2 "$url" -o "$archive"
          echo "${QNN_RUNTIME_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$qnn_dir"
          unzip -q "$archive" -d "$qnn_dir"
          mkdir -p "$qnn_dir/arm64-v8a"
          cp "$qnn_dir"/jni/arm64-v8a/lib*.so "$qnn_dir/arm64-v8a/"
          echo "BHE_QNN_ANDROID_DIR=$qnn_dir" >> "$GITHUB_ENV"

      - name: Build Rust Android Runtime
        run: BHE_ANDROID_NDK="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" scripts/build_mobile_runtime.sh

      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Restore Android signing keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.BHE_ANDROID_DEBUG_KEYSTORE }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE"
          mkdir -p "$HOME/.android"
          (umask 077; printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore")

      - name: Build Android package
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          # 更新检查只认数字版本加 + 构建标记：0.1.12-android.1 会被当成无法解析的开发版，
          # 悄悄关掉检查更新。发布标签和安装包文件名仍用 -android.N。
          app_version="${version/-android./+android.}"
          flutter build apk --release \
            --build-name="$version" \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define=BHE_VERSION="$app_version"
          apk="build/app/outputs/flutter-apk/app-release.apk"
          # 用固定证书显式签一次，避免依赖 Gradle 在 CI 里选中的调试密钥。
          apksigner_bin="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner_bin" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android "$apk"
          for library in libbhe_runtime.so libbhe_runtime_jni.so libonnxruntime.so libQnnHtp.so libQnnHtpV81Skel.so; do
            unzip -p "$apk" "lib/arm64-v8a/$library" > "$RUNNER_TEMP/$library"
            test -s "$RUNNER_TEMP/$library"
          done
          readelf --dyn-syms --wide "$RUNNER_TEMP/libbhe_runtime_jni.so" \
            | grep -q 'Java_com_bhe_bhe_1mobile_NativeRuntime_pushFrameRaw'
          readelf --dynamic --wide "$RUNNER_TEMP/libbhe_runtime_jni.so" \
            | grep -q 'Shared library: \[libbhe_runtime.so\]'
          unzip -l "$apk" assets/models/bball_model_qnn_v81.onnx | grep -q bball_model_qnn_v81.onnx
          # 每个版本必须用同一个证书签名，用户才能覆盖安装升级。
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          certs="$("$apksigner" verify --print-certs "$apk")"
          grep -q 'SHA-256 digest: 14f6d1117b858058f730afd96b880dff0fd8ecff2ebc10e387a5d89c10c0084e' <<< "$certs"
          # 检查更新要联网；v0.1.11 的 release 清单漏了 INTERNET，App 里连不上更新服务器。
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          permissions="$("$aapt2" dump permissions "$apk")"
          grep -q "name='android.permission.INTERNET'" <<< "$permissions"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$apk" \
            "$GITHUB_WORKSPACE/dist/BHE-android-arm64-v8a-v${version}-debug-signed.apk"
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum "BHE-android-arm64-v8a-v${version}-debug-signed.apk" \
            > "BHE-android-arm64-v8a-v${version}-debug-signed.apk.sha256"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: BHE-android-arm64-v8a
          path: |
            dist/BHE-android-arm64-v8a-v*-debug-signed.apk
            dist/BHE-android-arm64-v8a-v*-debug-signed.apk.sha256
          if-no-files-found: error

  release:
    name: Upload GitHub Release
    needs: [release-plan, macos, windows, android]
    if: >-
      ${{
        always() &&
        needs.release-plan.result == 'success' &&
        needs.release-plan.outputs.publish == 'true' &&
        (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
        (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
        (needs.android.result == 'success' || needs.android.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ needs.release-plan.outputs.tag }}
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: BHE-*
          path: dist
          merge-multiple: true

      - name: List release files
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -print -exec sha256sum {} \;

      - name: Publish GitHub Release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Basketball Highlight Editor ${{ env.TAG_NAME }}
          generate_release_notes: true
          prerelease: ${{ contains(env.TAG_NAME, '-') }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/*

  oss-upload:
    name: Upload release assets to OSS
    needs: [release-plan, release]
    if: >-
      ${{ always() && github.event_name == 'workflow_dispatch' && needs.release.result == 'success' && needs.release-plan.outputs.publish_oss == 'true' }}
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'bhe-dryrun-update-channel-v1' || 'bhe-production-update-channel-v1' }}
      cancel-in-progress: false
    outputs:
      publish_status: ${{ steps.publish.outputs.status }}
      failure_stage: ${{ steps.failure_stage.outputs.stage }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      OSS_ENDPOINT: oss-cn-beijing.aliyuncs.com
      OSS_BUCKET: oss://shengshengniannian
      OSS_PREFIX: shengshengniannian/basketball-highlight-editor/releases
      OSS_ANDROID_KEY: shengshengniannian/app/android/bhe/latest.apk
      OSSUTIL_VERSION: v1.7.19
      TAG_NAME: ${{ needs.release-plan.outputs.tag }}
      RELEASE_PLATFORM: ${{ needs.release-plan.outputs.platform }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - name: Check out publishing tools
        id: checkout_publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: publisher
      - name: Check out exact release notes
        id: checkout_source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}
          path: source
      - name: Configure Alibaba Cloud credentials
        id: credentials
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          role-to-assume: ${{ vars.ALIYUN_RAM_ROLE_ARN }}
          oidc-provider-arn: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
          role-session-name: bhe-release-${{ github.run_id }}
          role-session-expiration: 1800
          audience: sts.aliyuncs.com
      - name: Install ossutil
        id: install
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        shell: bash
        run: |
          set -euo pipefail
          go_bin="$(go env GOPATH)/bin"
          go install "github.com/aliyun/ossutil@${OSSUTIL_VERSION}"
          echo "$go_bin" >> "$GITHUB_PATH"
      - name: Download exact release assets
        id: download_release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bhe-release-assets"
          args=("$TAG_NAME" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/bhe-release-assets")
          case "$RELEASE_PLATFORM" in
            all) patterns=('BHE-*.dmg' 'BHE-*.dmg.sha256' 'BHE-*.zip' 'BHE-*.zip.sha256' 'BHE-*.apk' 'BHE-*.apk.sha256') ;;
            macos) patterns=('BHE-macos-*.dmg' 'BHE-macos-*.dmg.sha256') ;;
            windows) patterns=('BHE-windows-*.zip' 'BHE-windows-*.zip.sha256') ;;
            android) patterns=('BHE-android-*.apk' 'BHE-android-*.apk.sha256') ;;
            *) echo 'Unsupported platform' >&2; exit 1 ;;
          esac
          for pattern in "${patterns[@]}"; do args+=(--pattern "$pattern"); done
          gh release download "${args[@]}"
      - name: Download built assets for rehearsal
        id: download_build
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/download-artifact@v4
        with:
          pattern: BHE-*
          path: ${{ runner.temp }}/bhe-release-assets
          merge-multiple: true
      - name: Configure ossutil credentials
        id: config
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          config="$RUNNER_TEMP/bhe-ossutilconfig"
          ossutil config --config-file "$config" --endpoint "$OSS_ENDPOINT" \
            --access-key-id "$ALIBABA_CLOUD_ACCESS_KEY_ID" \
            --access-key-secret "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" \
            --sts-token "$ALIBABA_CLOUD_SECURITY_TOKEN"
      - name: Publish verified update channel
        id: publish
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.BHE_UPDATE_SIGNING_KEY }}
        run: |
          set +x
          set -euo pipefail
          test -n "$UPDATE_SIGNING_KEY"
          config="$RUNNER_TEMP/bhe-ossutilconfig"
          key="$RUNNER_TEMP/bhe-update-signing-key.pem"
          trap 'rm -f "$key" "$config"' EXIT
          umask 077
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          transport_args=(--oss-root "$OSS_BUCKET")
          if [[ "$DRY_RUN" == "true" ]]; then
            dry_run_arg=--dry-run
          else
            dry_run_arg=
            transport_args+=(--oss-config "$config")
          fi
          python3 publisher/scripts/publish_release_update.py \
            --tag "$TAG_NAME" --platform "$RELEASE_PLATFORM" \
            --assets-dir "$RUNNER_TEMP/bhe-release-assets" \
            "${transport_args[@]}" \
            --prefix "$OSS_PREFIX" --android-key "$OSS_ANDROID_KEY" \
            --base-url "https://shengshengniannian.oss-cn-beijing.aliyuncs.com/$OSS_PREFIX" \
            --android-base-url "https://oss.shengshengniannian.com/$OSS_PREFIX" \
            --android-alias-url "https://oss.shengshengniannian.com/$OSS_ANDROID_KEY" \
            --readme-zh source/README.md --readme-en source/README.en.md \
            --signing-key "$key" --work-dir "$RUNNER_TEMP/bhe-update-channel" ${dry_run_arg:+--dry-run}
          python3 -c 'import json,os; s=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"bhe-update-channel","publish-summary.json"))); print("status="+s["status"])' >> "$GITHUB_OUTPUT"
      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          set +x
          rm -f "$RUNNER_TEMP/bhe-update-signing-key.pem" "$RUNNER_TEMP/bhe-ossutilconfig"
      - name: Preserve outcome and manifest files (see verification status)
        id: backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-channel-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bhe-update-channel/*.json
            ${{ runner.temp }}/bhe-update-channel/*.json.sig
          if-no-files-found: warn


      - name: Record failure stage
        id: failure_stage
        if: always()
        shell: bash
        env:
          CHECKOUT_PUBLISHER: ${{ steps.checkout_publisher.outcome }}
          CHECKOUT_SOURCE: ${{ steps.checkout_source.outcome }}
          CREDENTIALS: ${{ steps.credentials.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          DOWNLOAD_RELEASE: ${{ steps.download_release.outcome }}
          DOWNLOAD_BUILD: ${{ steps.download_build.outcome }}
          CONFIG: ${{ steps.config.outcome }}
          BACKUP: ${{ steps.backup.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          stage=none
          for pair in "checkout_publisher:$CHECKOUT_PUBLISHER" "checkout_source:$CHECKOUT_SOURCE" \
            "credentials:$CREDENTIALS" "install:$INSTALL" "download_release:$DOWNLOAD_RELEASE" \
            "download_build:$DOWNLOAD_BUILD" "config:$CONFIG" "publish:$PUBLISH" "backup:$BACKUP"; do
            case "$pair" in *:failure|*:cancelled) stage="${pair%%:*}"; break ;; esac
          done
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

  publication-status:
    name: Report production channel outcome
    needs: [release-plan, macos, windows, android, release, oss-upload]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize publication and queue cancellation
        env:
          OUTCOME: ${{ needs.oss-upload.result }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          PUBLISH_STATUS: ${{ needs.oss-upload.outputs.publish_status }}
          FAILURE_STAGE: ${{ needs.oss-upload.outputs.failure_stage }}
          PLAN_OUTCOME: ${{ needs.release-plan.result }}
          MACOS_OUTCOME: ${{ needs.macos.result }}
          WINDOWS_OUTCOME: ${{ needs.windows.result }}
          ANDROID_OUTCOME: ${{ needs.android.result }}
          RELEASE_OUTCOME: ${{ needs.release.result }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            case "$PLAN_OUTCOME:$OUTCOME:$PUBLISH_STATUS" in
              failure:*) result='计划阶段拒绝'; FAILURE_STAGE=release-plan ;;
              cancelled:*) result='计划阶段取消'; FAILURE_STAGE=release-plan ;;
              *:success:dry-run-ok) result='演练完成 dry-run-ok' ;;
              *:failure:*) result='演练失败（OSS job）' ;;
              *:cancelled:*) result='演练取消（OSS job）' ;;
              *) result='演练未执行' ;;
            esac
            if [[ "$result" == '演练未执行' ]]; then
              for pair in "macos:${MACOS_OUTCOME:-}" "windows:${WINDOWS_OUTCOME:-}" "android:${ANDROID_OUTCOME:-}" "release:${RELEASE_OUTCOME:-}"; do
                case "$pair" in *:failure|*:cancelled) FAILURE_STAGE="${pair%%:*}"; break ;; esac
              done
            fi
            printf '### 更新通道演练\n\n计划阶段：%s；OSS job：%s；失败阶段：%s；结果：%s。未写入 OSS 发布对象；Actions 产物中保存演练文件（若已生成）。dry-run-ok 不代表正式发布成功。反映的是读取当时的通道状态，不保证之后发布一定成功；如有并行的正式发布请重跑。\n' "$PLAN_OUTCOME" "$OUTCOME" "${FAILURE_STAGE:-none}" "$result" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### 生产更新通道结果\n\nOSS job: **%s**\n\n只有 success 表示发布完成；cancelled 包括排队被替换，不能视为已发布。\n' "$OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          fi
