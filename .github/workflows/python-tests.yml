name: Python tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  open-source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_open_source.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  macos-intel-runtime:
    name: macOS Intel runtime (frozen dependency set)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the Intel runtime lock file
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: \
            -r requirements-macos-intel.txt pytest PyYAML
      - name: Verify torch can actually reach numpy
        # Intel 上 torch 冻结在 2.2.0，与 numpy 2.x 的 ABI 不兼容时两个包都能
        # import，只有 torch.from_numpy 抛 "Numpy is not available"。这一步
        # 保证锁文件里的组合真的能跑，而不是仅能导入。
        run: |
          python - <<'PY'
          import sys
          from scripts.check_runtime import _check_numpy_bridge
          ok, detail = _check_numpy_bridge(sys.executable)
          print(detail)
          raise SystemExit(0 if ok else 1)
          PY
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Run the test suite on the frozen dependency set
        run: python -m pytest -q

  windows-media:
    name: Windows bundled media pipeline
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify old Windows client patch inventory compatibility
        shell: powershell
        run: ./scripts/test_windows_patch_inventory.ps1
      - name: Test Windows media regression cases
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_create_proxy.py tests/test_media_tools.py tests/test_export_adapter.py
          if ($LASTEXITCODE -ne 0) { throw "Windows media regression tests failed" }
      - name: Prepare the release FFmpeg runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-8.1.zip"
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $extract = Join-Path $env:RUNNER_TEMP "bhe-ffmpeg"
          $runtime = Join-Path $env:RUNNER_TEMP "bhe-media-runtime"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          New-Item -ItemType Directory -Force -Path "$runtime\bin" | Out-Null
          foreach ($name in @("ffmpeg.exe", "ffprobe.exe")) {
            $tool = Get-ChildItem -Path $extract -Recurse -Filter $name | Select-Object -First 1
            if (-not $tool) { throw "$name was not found" }
            Copy-Item $tool.FullName "$runtime\bin\$name"
          }
          foreach ($name in @("engine", "src", "scripts")) {
            Copy-Item -Recurse "$env:GITHUB_WORKSPACE\$name" "$runtime\$name"
          }
          "BHE_MEDIA_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check real proxy and export with bundled LGPL FFmpeg
        run: |
          python "$env:BHE_MEDIA_RUNTIME\scripts\check_media_pipeline.py" --root "$env:BHE_MEDIA_RUNTIME"
          if ($LASTEXITCODE -ne 0) { throw "Windows bundled media pipeline failed" }
