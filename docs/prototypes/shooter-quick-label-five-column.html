<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BHE · 射手快标布局确认 · 五列单帧</title>
<style>
:root{color-scheme:dark;--bg:#0b0e14;--surface:#121620;--surface2:#1a1f2b;--surface3:#23242f;--text:#e6e8ee;--muted:#9aa0ac;--quiet:#8a90a0;--border:#23242f;--strong:#31343f;--orange:#ff6b2c;--blue:#6aa8ff;--green:#3fb950;--radius:8px}
*{box-sizing:border-box}body{margin:0;background:#080b10;color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Inter","PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button{border:0;color:inherit;background:transparent;border-radius:6px;min-height:32px;padding:6px 10px}button:hover{background:var(--surface3)}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:3px}button:disabled{cursor:default;opacity:.4}svg.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.with-icon{display:inline-flex;align-items:center;justify-content:center;gap:7px}.muted{color:var(--muted)}
.preview-tools{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:#10141c;border-bottom:1px solid var(--strong);position:sticky;top:0;z-index:5;flex-wrap:wrap}.preview-title{font-size:15px;font-weight:650}.preview-subtitle{font-size:12px;color:var(--muted);margin-top:3px}.preview-settings{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}select{background:var(--surface2);color:var(--text);border:1px solid var(--strong);border-radius:6px;padding:6px 10px}.outline{border:1px solid var(--strong);background:transparent}.primary{background:var(--orange);color:#1a0e06;font-weight:650}.primary:hover{background:#ff8653}
.preview-viewport{padding:20px 16px 30px;overflow:auto}.stage-wrap{margin:0 auto}.app{width:1440px;height:930px;display:grid;grid-template-columns:76px 1fr;grid-template-rows:58px 1fr;background:var(--bg);border:1px solid var(--strong);border-radius:12px;overflow:hidden;transform-origin:top left;box-shadow:0 20px 70px #0007}.sidebar{grid-row:1/3;display:flex;align-items:center;flex-direction:column;gap:14px;background:var(--surface);border-right:1px solid var(--border);padding:16px 10px}.brand{height:48px;width:48px;border-radius:12px;background:#ff6b2c18;color:var(--orange);display:grid;place-items:center;margin-bottom:14px}.brand svg{width:28px;height:28px}.sidebar button{width:52px;height:46px;color:var(--muted);padding:12px}.sidebar .current{color:var(--orange);background:#ff6b2c18}.sidebar .spacer{flex:1}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border)}.topbar-left{display:flex;align-items:center;gap:16px}.topbar h1{font-size:16px;line-height:1;margin:0;font-weight:650}.engine{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:20px;color:var(--green);background:#3fb95015;font-size:12px}.topbar-right{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px}.workspace{min-width:0;min-height:0;display:flex;flex-direction:column}.module-tabs{display:flex;align-items:center;gap:8px;padding:7px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}.module-tab{color:var(--muted);padding:9px 14px;font-weight:600}.module-tab[aria-selected="true"]{background:#ff6b2c24;color:var(--orange)}.module-tab .icon{width:19px;height:19px}
.quick-page{min-height:0;display:flex;flex:1;flex-direction:column}.toolbar{padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}.toolbar-main{display:flex;align-items:center;justify-content:space-between;gap:16px}.toolbar-left,.toolbar-right{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.count{color:var(--muted);font-size:12px;margin-right:4px;white-space:nowrap;font-variant-numeric:tabular-nums}.part{font-size:12px;max-width:100px}.filter{font-size:12px;color:var(--muted);padding:6px 13px;background:var(--surface2)}.filter[aria-pressed="true"]{background:#ff6b2c24;color:var(--orange)}.toolbar-right button{font-size:12px;color:var(--muted)}.toolbar-right .icon{width:16px;height:16px}.toolbar-hint{font-size:11px;color:var(--quiet);margin-top:7px}.card-scroll{overflow:auto;min-height:0;flex:1;padding:16px}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}.card{min-width:0;padding:9px;background:var(--surface);border:1px solid var(--border);border-radius:8px;transition:border-color .12s}.card.active{border-color:var(--orange);box-shadow:0 0 0 .5px var(--orange)}.card-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px}.card-title{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}.card-state{font-size:10px;color:var(--quiet);white-space:nowrap}.card-state.saved{color:var(--green)}
.photo{position:relative;aspect-ratio:3/4;width:100%;background:#18212d;border-radius:5px;overflow:hidden;border:1px solid var(--strong)}.photo svg.scene{height:100%;width:100%;display:block}.photo-badge{position:absolute;left:7px;top:7px;padding:3px 6px;border-radius:4px;font-size:9px;background:#0b0e14c9;color:#b7d5ff;border:1px solid #6aa8ff55}.placeholder-caption{position:absolute;left:0;right:0;bottom:9px;text-align:center;color:#c1cbd9;font-size:11px;letter-spacing:.3px;text-shadow:0 1px 5px #000}.photo-number{position:absolute;right:7px;top:7px;color:#c0c9d7;font-size:9px;background:#0b0e14a8;border-radius:3px;padding:3px 5px}.frame-picker{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;margin-top:5px}.frame-picker button{min-width:0;min-height:26px;padding:3px 1px;font-size:10px;color:var(--quiet);border-radius:4px;background:var(--surface2)}.frame-picker button[aria-pressed="true"]{background:#ff6b2c1c;color:var(--orange)}.player-heading{display:flex;align-items:center;justify-content:space-between;gap:4px;margin:8px 0 4px;min-height:26px}.player-label{font-size:11px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}.add-player{display:flex;align-items:center;gap:3px;white-space:nowrap;color:var(--orange);font-size:10px;min-height:26px;padding:3px 2px}.add-player .icon{width:13px;height:13px}.roster{display:flex;gap:4px;flex-wrap:wrap;align-content:flex-start;min-height:62px;max-height:94px;overflow:auto}.name-button{font-size:11px;min-height:28px;padding:4px 8px;background:var(--surface2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.name-button[aria-pressed="true"]{background:#ff6b2c24;color:var(--orange)}.card-bottom{display:flex;align-items:center;justify-content:space-between;gap:4px;border-top:1px solid var(--border);padding-top:5px;margin-top:6px}.card-bottom button{color:var(--muted);font-size:10px;padding:4px 3px;min-height:26px}.card-bottom .icon{width:13px;height:13px}.empty{padding:60px;text-align:center;color:var(--muted);grid-column:1/-1}
.goal-page{min-height:0;flex:1;display:grid;grid-template-columns:1fr 350px}.goal-video{margin:16px;border:1px solid var(--strong);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--muted);background:linear-gradient(145deg,#192331,#0e1721);position:relative}.goal-video .big-icon{width:74px;height:74px;opacity:.45}.goal-video .play{width:52px;height:52px;border:1px solid var(--strong);border-radius:50%;display:grid;place-items:center}.goal-queue{border-left:1px solid var(--border);padding:16px;background:var(--surface)}.goal-queue h2{font-size:15px;margin:0 0 15px}.goal-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}.goal-thumb{width:82px;height:46px;border:1px solid var(--strong);border-radius:5px;background:linear-gradient(150deg,#223246,#17202e)}.goal-item small{color:var(--quiet)}[hidden]{display:none!important}
dialog{width:390px;background:var(--surface);color:var(--text);border:1px solid var(--strong);border-radius:8px;padding:22px;box-shadow:0 18px 70px #0008}dialog::backdrop{background:#03060bb5}dialog h2{font-size:18px;margin:0 0 18px}dialog label{font-size:12px;color:var(--muted);display:block;margin-bottom:7px}dialog input{width:100%;padding:10px 12px;color:var(--text);border:1px solid var(--strong);border-radius:6px;background:var(--surface2)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.dialog-error{font-size:12px;color:#f85149;min-height:18px;margin-top:7px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:9px 16px;border:1px solid var(--strong);background:var(--surface2);box-shadow:0 8px 26px #0006;border-radius:7px;color:var(--text);font-size:12px;z-index:10;pointer-events:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@media(max-width:700px){.preview-tools{padding:10px 12px}.preview-settings{flex-wrap:wrap}.preview-viewport{padding:12px 8px}.preview-title{font-size:13px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
<symbol id="i-ball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M5.5 5.5c7 4 7 9 0 13M18.5 5.5c-7 4-7 9 0 13"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v11h-7v-7h-4v7H3Z"/></symbol>
<symbol id="i-review" viewBox="0 0 24 24"><path d="M3 6h7l2 3h9v12H3Z"/><path d="m8 14 3 3 6-6"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 17V3m-5 5 5-5 5 5M4 15v6h16v-6"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3v14m-5-5 5 5 5-5M4 18v3h16v-3"/></symbol>
<symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M2 20v-3a7 7 0 0 1 14 0v3ZM17 4a3 3 0 0 1 0 6m2 4a6 6 0 0 1 3 6"/></symbol>
<symbol id="i-add" viewBox="0 0 24 24"><circle cx="8" cy="7" r="3"/><path d="M1 20v-3a7 7 0 0 1 14 0v3M19 8v8m-4-4h8"/></symbol>
<symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m10 8 6 4-6 4Z"/></symbol>
<symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 5 3 11l6 6M3 11h11a6 6 0 0 1 6 6v3"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0 0 5M20 3v7h-7"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></symbol>
</svg>
<header class="preview-tools">
<div><div class="preview-title">BHE 布局确认 · 五列竖向卡片</div><div class="preview-subtitle">HTML 占位原型 · 默认只展示中间帧 · 姓名及状态均为演示数据</div></div>
<div class="preview-settings"><label for="preview-width">App 窗口宽度</label><select id="preview-width"><option value="1280">1280 px</option><option value="1440" selected>1440 px</option><option value="1600">1600 px</option></select><button id="fit-toggle" class="outline" aria-pressed="true">适应窗口</button></div>
</header>
<div class="preview-viewport"><div class="stage-wrap" id="stage-wrap">
<div class="app" id="app">
<aside class="sidebar" aria-label="BHE 主导航">
<div class="brand"><svg class="icon" aria-hidden="true"><use href="#i-ball"/></svg></div>
<button title="首页（占位）" class="demo-action" aria-label="首页（占位）"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg></button>
<button title="导入（占位）" class="demo-action" aria-label="导入（占位）"><svg class="icon" aria-hidden="true"><use href="#i-up"/></svg></button>
<button title="审核" class="current" aria-label="审核" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#i-review"/></svg></button>
<button title="导出（占位）" class="demo-action" aria-label="导出（占位）"><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg></button>
<div class="spacer"></div><span class="muted" style="font-size:11px">BHE</span>
</aside>
<header class="topbar"><div class="topbar-left"><h1>审核</h1><span class="engine">✓ Engine 就绪</span></div><div class="topbar-right"><span>本地处理</span><button class="demo-action" aria-label="更多设置（占位）"><svg class="icon" aria-hidden="true"><use href="#i-more"/></svg></button></div></header>
<main class="workspace">
<nav class="module-tabs" role="tablist" aria-label="审核子模块">
<button class="module-tab with-icon" role="tab" id="tab-goals" aria-controls="goal-page" aria-selected="false"><svg class="icon" aria-hidden="true"><use href="#i-ball"/></svg>进球审核</button>
<button class="module-tab with-icon" role="tab" id="tab-shooter" aria-controls="quick-page" aria-selected="true"><svg class="icon" aria-hidden="true"><use href="#i-people"/></svg>射手快标</button>
</nav>
<section class="quick-page" id="quick-page" role="tabpanel" aria-labelledby="tab-shooter">
<div class="toolbar"><div class="toolbar-main">
<div class="toolbar-left"><span class="count" id="count">已标 0 / 15</span><select class="part" aria-label="视频片段"><option>第 1 段</option></select><button class="filter" data-filter="all" aria-pressed="true">全部</button><button class="filter" data-filter="pending" aria-pressed="false">待标注</button><button class="filter" data-filter="uncertain" aria-pressed="false">需核实</button></div>
<div class="toolbar-right"><button class="with-icon" id="add-roster"><svg class="icon" aria-hidden="true"><use href="#i-add"/></svg>添加球员</button><button class="with-icon" id="undo" disabled><svg class="icon" aria-hidden="true"><use href="#i-undo"/></svg>撤销</button><button class="outline with-icon demo-action"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>补齐画面</button><button class="demo-action" aria-label="更多（占位）"><svg class="icon" aria-hidden="true"><use href="#i-more"/></svg></button></div>
</div><div class="toolbar-hint">看中间帧认人，点击姓名保存。需要核实时，再切换前后帧或查看视频。</div></div>
<div class="card-scroll"><div class="cards" id="cards" aria-label="射手候选卡片，每行五张"></div></div>
</section>
<section class="goal-page" id="goal-page" role="tabpanel" aria-labelledby="tab-goals" hidden>
<div class="goal-video"><svg class="icon big-icon" aria-hidden="true"><use href="#i-video"/></svg><span>原有进球审核 · 视频区域占位</span><div class="play">▷</div><small class="muted">进入 App 的审核模块时，默认选中此页</small></div>
<div class="goal-queue"><h2>候选片段 <span class="muted">15</span></h2><div id="goal-items"></div></div>
</section>
</main></div></div></div>
<dialog id="player-dialog" aria-labelledby="dialog-title">
<form id="player-form"><h2 id="dialog-title">添加球员</h2><label for="player-name">球员名字</label><input id="player-name" placeholder="例如：科比、罗斯" autocomplete="off" maxlength="40" required><div class="dialog-error" id="dialog-error" aria-live="polite"></div><div class="dialog-actions"><button type="button" id="cancel-player">取消</button><button type="submit" class="primary">添加</button></div></form>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="./shooter-quick-label-five-column.js"></script>
</body>
</html>
